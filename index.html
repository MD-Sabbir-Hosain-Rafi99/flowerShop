     <section id="banner">

            <div class="bannerRoot">
                <div class="leftBanner">
                    <h1>ALWAYS <span style="color: #E95A08;">FRESH FLOWERS</span></h1>
                    <p style="font-size: 22px; color: rgb(142, 141, 141); padding-right: 190px; margin-top: 20px;">Indulge your senses with the beauty and fragrance of our fresh flower shop. From classic roses to exotic blooms, we offer a wide variety of fresh flowers that are perfect for any occasion. </p>
                </div>
                <div class="rightBanner">
                    <picture>
                        <img src="images/banner.png" alt="banner.png">
                    </picture>
                </div>
            </div>
        </div>
     </section>
